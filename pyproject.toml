[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-option-project"
version = "0.1.0"
description = "Auditable 50ETF option pricing and volatility research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "statsmodels>=0.14,<1", "requests>=2.31,<3"]

[project.optional-dependencies]
data = ["akshare>=1.18"]
dev = ["pytest>=8,<10", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
etf-options = "etf_option.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
